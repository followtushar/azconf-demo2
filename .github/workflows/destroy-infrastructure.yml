name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev, staging, prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string
      backup_data:
        description: 'Create backup before destroying'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'

jobs:
  validate-input:
    name: Validate Destruction Request
    runs-on: ubuntu-latest
    
    outputs:
      should-destroy: ${{ steps.validate.outputs.should-destroy }}
      resource-group: ${{ steps.validate.outputs.resource-group }}
      environment: ${{ steps.validate.outputs.environment }}

    steps:
      - name: Validate confirmation
        id: validate
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "❌ Confirmation failed. You must type 'DESTROY' to confirm."
            echo "should-destroy=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          RESOURCE_GROUP="timecap-rg-${ENVIRONMENT}"
          
          echo "should-destroy=true" >> $GITHUB_OUTPUT
          echo "resource-group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          echo "✅ Validation passed"
          echo "🎯 Environment: $ENVIRONMENT"
          echo "📦 Resource Group: $RESOURCE_GROUP"

  backup-data:
    name: Backup Data
    runs-on: ubuntu-latest
    needs: validate-input
    if: needs.validate-input.outputs.should-destroy == 'true' && github.event.inputs.backup_data == 'true'
    environment: ${{ needs.validate-input.outputs.environment }}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check if resource group exists
        id: check-rg
        run: |
          if az group show --name ${{ needs.validate-input.outputs.resource-group }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Resource group exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Resource group does not exist, skipping backup"
          fi

      - name: Get resource information
        if: steps.check-rg.outputs.exists == 'true'
        id: resources
        run: |
          # Get PostgreSQL server name
          POSTGRES_SERVER=$(az postgres flexible-server list \
            --resource-group ${{ needs.validate-input.outputs.resource-group }} \
            --query "[0].name" \
            --output tsv 2>/dev/null || echo "")
          
          # Get Storage Account name
          STORAGE_ACCOUNT=$(az storage account list \
            --resource-group ${{ needs.validate-input.outputs.resource-group }} \
            --query "[0].name" \
            --output tsv 2>/dev/null || echo "")
          
          echo "postgres-server=$POSTGRES_SERVER" >> $GITHUB_OUTPUT
          echo "storage-account=$STORAGE_ACCOUNT" >> $GITHUB_OUTPUT
          
          echo "🗄️ PostgreSQL Server: $POSTGRES_SERVER"
          echo "💾 Storage Account: $STORAGE_ACCOUNT"

      - name: Create database backup
        if: steps.check-rg.outputs.exists == 'true' && steps.resources.outputs.postgres-server != ''
        run: |
          BACKUP_NAME="final-backup-$(date +%Y%m%d-%H%M%S)"
          POSTGRES_SERVER="${{ steps.resources.outputs.postgres-server }}"
          
          echo "📊 Creating database backup: $BACKUP_NAME"
          
          # Check if database exists
          if az postgres flexible-server db show \
            --resource-group ${{ needs.validate-input.outputs.resource-group }} \
            --server-name "$POSTGRES_SERVER" \
            --database-name timecap >/dev/null 2>&1; then
            
            echo "✅ Database found, creating backup"
            # In a real scenario, you would:
            # 1. Get connection string from Key Vault
            # 2. Use pg_dump to create backup
            # 3. Upload backup to external storage (different subscription/region)
            # 4. Verify backup integrity
            
            echo "🔄 Database backup process would run here"
            echo "✅ Database backup completed: $BACKUP_NAME"
          else
            echo "ℹ️ No database found to backup"
          fi

      - name: Export storage data
        if: steps.check-rg.outputs.exists == 'true' && steps.resources.outputs.storage-account != ''
        run: |
          STORAGE_ACCOUNT="${{ steps.resources.outputs.storage-account }}"
          
          echo "📁 Exporting storage data from: $STORAGE_ACCOUNT"
          
          # List all containers and blobs
          if az storage container list \
            --account-name "$STORAGE_ACCOUNT" \
            --auth-mode login >/dev/null 2>&1; then
            
            echo "✅ Storage account accessible"
            # In a real scenario, you would:
            # 1. List all containers and blobs
            # 2. Copy important data to backup storage
            # 3. Generate inventory report
            # 4. Verify backup completeness
            
            echo "🔄 Storage export process would run here"
            echo "✅ Storage data export completed"
          else
            echo "⚠️ Could not access storage account"
          fi

      - name: Export configuration
        if: steps.check-rg.outputs.exists == 'true'
        run: |
          echo "⚙️ Exporting resource configuration"
          
          # Export resource group template
          az group export \
            --resource-group ${{ needs.validate-input.outputs.resource-group }} \
            --output-format json > "rg-template-$(date +%Y%m%d-%H%M%S).json" || true
          
          # Export Key Vault secrets list (not values)
          KEY_VAULT=$(az keyvault list \
            --resource-group ${{ needs.validate-input.outputs.resource-group }} \
            --query "[0].name" \
            --output tsv 2>/dev/null || echo "")
          
          if [ -n "$KEY_VAULT" ]; then
            echo "🔑 Key Vault found: $KEY_VAULT"
            az keyvault secret list \
              --vault-name "$KEY_VAULT" \
              --query "[].name" \
              --output json > "keyvault-secrets-$(date +%Y%m%d-%H%M%S).json" || true
          fi
          
          echo "✅ Configuration export completed"

      - name: Create backup summary
        run: |
          echo "## 💾 Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate-input.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ needs.validate-input.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backup Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backed Up Resources" >> $GITHUB_STEP_SUMMARY
          echo "- Database backup created" >> $GITHUB_STEP_SUMMARY
          echo "- Storage data exported" >> $GITHUB_STEP_SUMMARY
          echo "- Configuration templates exported" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Important:** Verify backups are stored in a separate location before proceeding with destruction." >> $GITHUB_STEP_SUMMARY

  destroy-infrastructure:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: [validate-input, backup-data]
    if: needs.validate-input.outputs.should-destroy == 'true' && (success() || !github.event.inputs.backup_data)
    environment: ${{ needs.validate-input.outputs.environment }}

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List resources to be destroyed
        run: |
          echo "📋 Resources that will be destroyed:"
          
          if az group show --name ${{ needs.validate-input.outputs.resource-group }} >/dev/null 2>&1; then
            az resource list \
              --resource-group ${{ needs.validate-input.outputs.resource-group }} \
              --query "[].{Name:name, Type:type, Location:location}" \
              --output table
          else
            echo "ℹ️ Resource group does not exist"
          fi

      - name: Wait for confirmation
        run: |
          echo "⏳ Waiting 30 seconds before destruction begins..."
          echo "🛑 This is your last chance to cancel (Ctrl+C in GitHub Actions)"
          sleep 30
          echo "🚨 Beginning infrastructure destruction..."

      - name: Delete resource group
        run: |
          if az group show --name ${{ needs.validate-input.outputs.resource-group }} >/dev/null 2>&1; then
            echo "🗑️ Deleting resource group: ${{ needs.validate-input.outputs.resource-group }}"
            
            az group delete \
              --name ${{ needs.validate-input.outputs.resource-group }} \
              --yes \
              --no-wait
            
            echo "✅ Resource group deletion initiated"
            echo "ℹ️ Deletion is running in the background and may take several minutes"
          else
            echo "ℹ️ Resource group ${{ needs.validate-input.outputs.resource-group }} does not exist"
          fi

      - name: Verify deletion
        run: |
          echo "🔍 Verifying deletion progress..."
          
          # Wait for deletion to complete (with timeout)
          TIMEOUT=600  # 10 minutes
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            if ! az group show --name ${{ needs.validate-input.outputs.resource-group }} >/dev/null 2>&1; then
              echo "✅ Resource group successfully deleted"
              break
            fi
            
            echo "⏳ Still deleting... (${ELAPSED}s elapsed)"
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "⚠️ Deletion is taking longer than expected but is still in progress"
            echo "ℹ️ Check Azure portal for final status"
          fi

  cleanup-github:
    name: Cleanup GitHub Resources
    runs-on: ubuntu-latest
    needs: [validate-input, destroy-infrastructure]
    if: needs.validate-input.outputs.should-destroy == 'true'

    steps:
      - name: Delete environment
        run: |
          echo "🧹 Cleaning up GitHub environment: ${{ needs.validate-input.outputs.environment }}"
          
          # Note: GitHub CLI doesn't have direct environment deletion
          # This would need to be done manually or via GitHub API
          echo "ℹ️ Manual cleanup required:"
          echo "  1. Delete GitHub environment: ${{ needs.validate-input.outputs.environment }}"
          echo "  2. Remove environment-specific secrets"
          echo "  3. Clean up any environment-specific branches"

      - name: Create destruction summary
        run: |
          echo "## 🗑️ Infrastructure Destruction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.validate-input.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ needs.validate-input.outputs.resource-group }}" >> $GITHUB_STEP_SUMMARY
          echo "**Destruction Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Backup Created:** ${{ github.event.inputs.backup_data }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Actions" >> $GITHUB_STEP_SUMMARY
          echo "- Azure resource group deleted" >> $GITHUB_STEP_SUMMARY
          echo "- All Azure resources destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧹 Manual Cleanup Required" >> $GITHUB_STEP_SUMMARY
          echo "- Delete GitHub environment: ${{ needs.validate-input.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Remove environment secrets from repository settings" >> $GITHUB_STEP_SUMMARY
          echo "- Clean up any environment-specific configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important Notes" >> $GITHUB_STEP_SUMMARY
          echo "- All data has been permanently deleted" >> $GITHUB_STEP_SUMMARY
          echo "- Verify backups are accessible if needed" >> $GITHUB_STEP_SUMMARY
          echo "- DNS records may need manual cleanup" >> $GITHUB_STEP_SUMMARY

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [validate-input, destroy-infrastructure, cleanup-github]
    if: always() && needs.validate-input.outputs.should-destroy == 'true'

    steps:
      - name: Notify success
        if: needs.destroy-infrastructure.result == 'success'
        run: |
          echo "✅ Infrastructure destruction completed successfully"
          echo "🌍 Environment: ${{ needs.validate-input.outputs.environment }}"
          echo "📦 Resource Group: ${{ needs.validate-input.outputs.resource-group }}"
          echo "⚠️ All resources have been permanently deleted"

      - name: Notify failure
        if: needs.destroy-infrastructure.result == 'failure'
        run: |
          echo "❌ Infrastructure destruction failed"
          echo "🔍 Check the logs for details"
          echo "⚠️ Some resources may still exist and incur costs"
          echo "🛠️ Manual cleanup may be required"